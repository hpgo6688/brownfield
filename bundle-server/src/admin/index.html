<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bundle Server Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --warn: #ea580c;
      --warn-hover: #c2410c;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --radius: 12px;
      --radius-lg: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 99, 235, 0.12), transparent),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .15s, color .15s, box-shadow .15s;
    }

    .link-btn:hover {
      color: var(--primary);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card + .card,
    .grid .card {
      margin-top: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .card-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* App shell */
    .app-shell {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      min-height: 560px;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 8px;
      overflow-y: auto;
      background: var(--surface-2);
    }

    .sidebar-header {
      padding: 10px 12px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
    }

    .sidebar-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .sidebar-item:hover:not(.active) {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .sidebar-item.active {
      background: var(--primary-soft);
      border-color: #93c5fd;
      box-shadow: none;
    }

    .sidebar-item.active .sidebar-item-title {
      color: var(--primary);
    }

    .sidebar-item.active .sidebar-item-meta {
      color: #3b82f6;
    }

    .sidebar-item.add-item {
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .sidebar-item-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .sidebar-item.add-item.active .sidebar-item-icon {
      background: var(--primary);
      color: #fff;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 8px;
    }

    .sidebar-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .sidebar-item-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }

    .sidebar-item-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .sidebar-item .badge {
      font-size: 10px;
      padding: 2px 8px;
    }

    .sidebar-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-subtle);
      font-size: 13px;
      line-height: 1.6;
    }

    .detail {
      flex: 1;
      min-width: 0;
      padding: 20px 22px;
      overflow-y: auto;
    }

    .detail .card {
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .detail .card:hover {
      box-shadow: none;
    }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      color: var(--text-subtle);
      font-size: 14px;
      text-align: center;
      padding: 40px 24px;
      gap: 8px;
    }

    .detail-empty-icon {
      font-size: 32px;
      opacity: 0.4;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text);
    }

    .meta .dot {
      color: var(--text-subtle);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.on { background: var(--success-bg); color: var(--success); }
    .badge.off { background: var(--danger-bg); color: var(--danger); }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.span-2 { grid-column: span 2; }
    .field.span-3 { grid-column: span 3; }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .field label .optional {
      font-weight: 400;
      color: var(--text-subtle);
    }

    input[type="text"],
    input:not([type]),
    select {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input::placeholder { color: var(--text-subtle); }

    .form-actions {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr auto auto;
      gap: 12px;
      align-items: end;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* File input */
    .file-field input[type="file"] {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
    }

    .file-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      background: var(--surface-2);
      transition: border-color .15s, background .15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-label:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .file-label.has-file {
      border-style: solid;
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* Checkbox */
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 0;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .checkbox-field input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Buttons */
    button {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: var(--surface-2);
      border-color: #94a3b8;
    }

    button:active:not(:disabled) { transform: scale(0.98); }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    button.warn {
      background: transparent;
      color: var(--warn);
      border-color: #fed7aa;
    }

    button.warn:hover:not(:disabled) {
      background: #fff7ed;
      border-color: var(--warn);
    }

    button.danger {
      background: transparent;
      color: var(--danger, #dc2626);
      border-color: #fecaca;
    }

    button.danger:hover:not(:disabled) {
      background: #fef2f2;
      border-color: var(--danger, #dc2626);
    }

    button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      padding: 8px 10px;
    }

    button.ghost:hover:not(:disabled) {
      background: var(--surface-2);
      color: var(--text);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions button {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      background: var(--surface-2);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: #fafbfc; }

    td code {
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      word-break: break-all;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 5px;
      color: #475569;
    }

    .empty-row td {
      text-align: center;
      color: var(--text-subtle);
      padding: 28px;
      font-size: 13px;
    }

    /* Section label */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
      margin: 24px 0 10px;
    }

    /* Loading & error */
    .skeleton {
      height: 120px;
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error-card {
      border-color: #fecaca;
      background: #fef2f2;
      color: var(--danger);
    }

    /* Toast */
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: var(--text);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 20px 16px 40px; }
      .app-shell {
        flex-direction: column;
        min-height: auto;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px;
      }
      .sidebar-header,
      .sidebar-divider { display: none; }
      .sidebar-item {
        flex-shrink: 0;
        min-width: 120px;
      }
      .sidebar-item.add-item { min-width: 100px; }
      .detail { padding: 16px; }
      .form-grid,
      .form-grid.cols-2 { grid-template-columns: 1fr; }
      .field.span-2,
      .field.span-3 { grid-column: span 1; }
      .upload-grid { grid-template-columns: 1fr; }
      .form-actions { flex-direction: column; align-items: stretch; }
      .form-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-brand">
        <div class="logo">B</div>
        <div>
          <h1>Bundle Server</h1>
          <p class="sub">管理 Remote 远程业务入口：新建、发布、切换版本与回滚</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="primary" id="refreshBtn">↻ 刷新</button>
        <a class="link-btn" href="/api/manifest" target="_blank">查看 Manifest ↗</a>
      </div>
    </header>

    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="featureSidebar">
        <div class="sidebar-header">菜单</div>
        <div class="skeleton" style="height:44px;margin:4px 8px;border-radius:10px"></div>
      </aside>
      <main class="detail" id="featureDetail">
        <div class="skeleton" style="height:320px;border-radius:12px"></div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const featureSidebar = document.getElementById('featureSidebar');
    const featureDetail = document.getElementById('featureDetail');
    const toastEl = document.getElementById('toast');
    const ADD_ID = '__add__';
    let features = [];
    let selectedId = ADD_ID;

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || response.statusText);
      return data;
    }

    function bindFileLabels(root) {
      root.querySelectorAll('input[type="file"]').forEach(input => {
        const label = input.closest('.file-field')?.querySelector('.file-label');
        if (!label) return;
        const defaultText = label.dataset.default || '选择 .jsbundle 文件';
        input.addEventListener('change', () => {
          if (input.files?.[0]) {
            label.textContent = input.files[0].name;
            label.classList.add('has-file');
          } else {
            label.textContent = defaultText;
            label.classList.remove('has-file');
          }
        });
      });
    }

    function renderSidebar() {
      const addItem = `
        <button
          type="button"
          class="sidebar-item add-item${selectedId === ADD_ID ? ' active' : ''}"
          data-sidebar-id="${ADD_ID}"
        >
          <span class="sidebar-item-icon">＋</span>
          <span>
            <span class="sidebar-item-title">添加</span>
            <span class="sidebar-item-meta">新建 Remote 入口</span>
          </span>
        </button>`;

      const featureItems = features.map(feature => {
        const active = feature.activeRelease;
        const version = active ? active.version : '—';
        return `
          <button
            type="button"
            class="sidebar-item${feature.id === selectedId ? ' active' : ''}"
            data-sidebar-id="${feature.id}"
          >
            <span class="sidebar-item-title">${feature.title}</span>
            <span class="sidebar-item-meta">${feature.id}</span>
            <span class="sidebar-item-footer">
              <span class="badge ${feature.enabled ? 'on' : 'off'}">${feature.enabled ? '已启用' : '已禁用'}</span>
              <span class="sidebar-item-meta">v${version}</span>
            </span>
          </button>`;
      }).join('');

      const divider = features.length ? '<div class="sidebar-divider"></div>' : '';

      featureSidebar.innerHTML = `
        <div class="sidebar-header">菜单</div>
        ${addItem}
        ${divider}
        ${featureItems}`;

      featureSidebar.querySelectorAll('[data-sidebar-id]').forEach(btn => {
        btn.addEventListener('click', () => selectItem(btn.dataset.sidebarId));
      });
    }

    function renderCreateDetail() {
      featureDetail.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2><span class="card-icon">＋</span> 新建 Remote 入口</h2>
          </div>
          <form id="createForm">
            <div class="form-grid">
              <div class="field">
                <label for="create-id">Entry ID</label>
                <input id="create-id" name="id" placeholder="order" required pattern="[a-z][a-z0-9-]*" />
              </div>
              <div class="field">
                <label for="create-title">标题</label>
                <input id="create-title" name="title" placeholder="订单" required />
              </div>
              <div class="field">
                <label for="create-module">Module Name</label>
                <input id="create-module" name="moduleName" placeholder="OrderScreen" required />
              </div>
              <div class="field span-2">
                <label for="create-metro">Metro Entry</label>
                <input id="create-metro" name="metroEntry" placeholder="bundles/order/index" required />
              </div>
              <div class="field">
                <label for="create-icon">SF Symbol <span class="optional">（可选）</span></label>
                <input id="create-icon" name="icon" placeholder="cart" />
              </div>
            </div>
            <div class="form-actions">
              <button class="primary" type="submit">创建入口</button>
            </div>
          </form>
        </div>`;

      featureDetail.querySelector('#createForm').addEventListener('submit', handleCreateSubmit);
    }

    async function handleCreateSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = Object.fromEntries(new FormData(form).entries());
      await api('/api/features', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      toast('Remote 入口已创建');
      selectedId = payload.id;
      form.reset();
      loadFeatures();
    }

    function renderDetail(feature) {
      const active = feature.activeRelease;
      const releases = feature.releases || [];

      const rows = releases.map(release => {
        const isActive = active && active.id === release.id;
        return `
          <tr>
            <td>
              <strong>${release.version}</strong>
              ${isActive ? ' <span class="badge on">线上</span>' : ''}
            </td>
            <td><code>${release.hash}</code></td>
            <td style="color:var(--text-muted);font-size:12px">${new Date(release.createdAt).toLocaleString()}</td>
            <td>
              <div class="actions">
                <button ${isActive ? 'disabled' : ''} data-action="activate" data-feature="${feature.id}" data-release="${release.id}">
                  设为线上
                </button>
                <button class="warn" ${isActive ? 'disabled' : ''} data-action="rollback" data-feature="${feature.id}" data-release="${release.id}">
                  回滚
                </button>
                <button class="danger" data-action="delete" data-feature="${feature.id}" data-release="${release.id}" data-version="${release.version}">
                  删除
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');

      featureDetail.innerHTML = `
        <div class="card" data-feature-card="${feature.id}">
          <div class="card-header">
            <h2>
              ${feature.title}
              <span class="badge ${feature.enabled ? 'on' : 'off'}">${feature.enabled ? '已启用' : '已禁用'}</span>
            </h2>
            <button class="ghost" data-action="toggle" data-feature="${feature.id}">
              ${feature.enabled ? '禁用入口' : '启用入口'}
            </button>
          </div>
          <div class="meta">
            <code>${feature.id}</code>
            <span class="dot">·</span>
            <code>${feature.moduleName}</code>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>版本</th><th>Hash</th><th>发布时间</th><th>操作</th></tr>
              </thead>
              <tbody>${rows || '<tr class="empty-row"><td colspan="4">暂无发布记录，请上传 bundle</td></tr>'}</tbody>
            </table>
          </div>
          <form data-upload="${feature.id}">
            <div class="upload-grid">
              <div class="field">
                <label>版本号</label>
                <input name="version" placeholder="1.0.0" required />
              </div>
              <div class="field">
                <label>备注 <span class="optional">（可选）</span></label>
                <input name="notes" placeholder="更新说明" />
              </div>
              <div class="field file-field">
                <label>Bundle 文件</label>
                <input type="file" name="file" id="file-${feature.id}" accept=".jsbundle" required />
                <label class="file-label" for="file-${feature.id}" data-default="选择 .jsbundle 文件">选择 .jsbundle 文件</label>
              </div>
              <label class="checkbox-field">
                <input type="checkbox" name="activate" checked />
                上传后立即上线
              </label>
              <button class="primary" type="submit">上传</button>
            </div>
          </form>
        </div>`;

      bindFileLabels(featureDetail);
      bindDetailActions();
    }

    function renderDetailEmpty() {
      featureDetail.innerHTML = `
        <div class="detail-empty">
          <div class="detail-empty-icon">📦</div>
          <div>请从左侧菜单选择入口</div>
        </div>`;
    }

    function selectItem(id) {
      selectedId = id;
      renderSidebar();
      if (id === ADD_ID) {
        renderCreateDetail();
        return;
      }
      const feature = features.find(f => f.id === id);
      if (feature) renderDetail(feature);
      else renderDetailEmpty();
    }

    function bindDetailActions() {
      featureDetail.querySelectorAll('[data-action="toggle"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.feature;
          await api(`/api/features/${id}/toggle`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          toast('入口状态已更新');
          loadFeatures();
        });
      });

      featureDetail.querySelectorAll('[data-action="activate"], [data-action="rollback"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const featureId = btn.dataset.feature;
          const releaseId = btn.dataset.release;
          const path = btn.dataset.action === 'rollback'
            ? `/api/features/${featureId}/rollback`
            : `/api/features/${featureId}/activate/${releaseId}`;

          if (btn.dataset.action === 'rollback') {
            if (!confirm('确认回滚到此版本？')) return;
            await api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ releaseId }) });
          } else {
            await api(path, { method: 'POST' });
          }

          toast(btn.dataset.action === 'rollback' ? '已回滚' : '已切换线上版本');
          loadFeatures();
        });
      });

      featureDetail.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const featureId = btn.dataset.feature;
          const releaseId = btn.dataset.release;
          const version = btn.dataset.version;
          const isActive = btn.closest('tr')?.querySelector('.badge.on') != null;
          const msg = isActive
            ? `确认删除线上版本 v${version}？将删除 bundle 文件并切换到次新版本（若无则清空线上版本）。`
            : `确认删除版本 v${version}？将同时删除服务端 bundle 文件。`;
          if (!confirm(msg)) return;

          await api(`/api/features/${featureId}/releases/${releaseId}`, { method: 'DELETE' });
          toast(`已删除 v${version}`);
          loadFeatures();
        });
      });

      featureDetail.querySelectorAll('form[data-upload]').forEach(form => {
        form.addEventListener('submit', async event => {
          event.preventDefault();
          const featureId = form.dataset.upload;
          const formData = new FormData(form);
          formData.append('featureId', featureId);
          formData.append('activate', form.activate.checked ? 'true' : 'false');

          await api('/api/bundles/upload', { method: 'POST', body: formData });
          toast('上传成功');
          form.reset();
          form.querySelectorAll('.file-label').forEach(l => {
            l.textContent = l.dataset.default || '选择 .jsbundle 文件';
            l.classList.remove('has-file');
          });
          loadFeatures();
        });
      });
    }

    async function loadFeatures() {
      const data = await api('/api/admin/features');
      features = data.features || [];

      if (selectedId !== ADD_ID && !features.some(f => f.id === selectedId)) {
        selectedId = features.length ? features[0].id : ADD_ID;
      }

      renderSidebar();
      if (selectedId === ADD_ID) renderCreateDetail();
      else {
        const feature = features.find(f => f.id === selectedId);
        if (feature) renderDetail(feature);
        else renderDetailEmpty();
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadFeatures);

    loadFeatures().catch(error => {
      featureSidebar.innerHTML = `<div class="sidebar-empty" style="color:var(--danger)">加载失败</div>`;
      featureDetail.innerHTML = `<div class="card error-card">加载失败：${error.message}</div>`;
    });
  </script>
</body>
</html>
